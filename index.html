<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#83d4dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="合唱リリック">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合唱リリックフラッシュ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Mono:wght@500&family=Playfair+Display:ital,wght@1,800;1,900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{
  --ground:#83d4dc;
  --ground-2:#74c9d2;
  --frame:#ffffff;
  --ink:#0d2e3a;
  --ink-soft:rgba(13,46,58,.62);
  --ink-faint:rgba(13,46,58,.28);
  --accent:#d9364a;
  --control:#ffffff;
  --sheet:#f4fbfc;
  --sheet-ink:#0d2e3a;
  --line:rgba(13,46,58,.14);
  --font-ui:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  --font-lyric:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-dyn:"Playfair Display","Times New Roman",Georgia,serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0b2830;--ground-2:#0e323b;--frame:#bfe9ee;--ink:#e9f8fa;
    --ink-soft:rgba(233,248,250,.66);--ink-faint:rgba(233,248,250,.26);
    --accent:#ff7d8a;--control:#e9f8fa;--sheet:#123640;--sheet-ink:#e9f8fa;--line:rgba(233,248,250,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0b2830;--ground-2:#0e323b;--frame:#bfe9ee;--ink:#e9f8fa;
  --ink-soft:rgba(233,248,250,.66);--ink-faint:rgba(233,248,250,.26);
  --accent:#ff7d8a;--control:#e9f8fa;--sheet:#123640;--sheet-ink:#e9f8fa;--line:rgba(233,248,250,.16);
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font-ui);padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink-soft);outline-offset:2px}
.app{height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:calc(10px + env(safe-area-inset-top, 0px)) 10px}

/* ---- top bar ---- */
.top{display:flex;align-items:center;gap:8px;min-width:0}
.chip{display:flex;align-items:center;gap:6px;min-width:0;height:40px;padding:0 14px;border-radius:20px;border:0;background:var(--ground-2);color:var(--ink);font-weight:700;font-size:14px}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.song{flex:1 1 auto;justify-content:flex-start}
.chip.part{flex:0 1 auto;max-width:48%}
.chip .lab{font-size:11px;font-weight:500;color:var(--ink-soft);letter-spacing:.06em}
.iconbtn{flex:none;width:40px;height:40px;border-radius:20px;border:0;background:var(--ground-2);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}

/* ---- stage ---- */
.stage{flex:1 1 auto;min-height:0;border:3px solid var(--frame);border-radius:4px;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,2.3fr) minmax(0,1fr);
  grid-template-rows:minmax(0,1.05fr) auto minmax(0,1.9fr);
  grid-template-areas:"expr wedge next" "dyn beats ." "time lyric .";
  padding:clamp(8px,2vw,22px);gap:clamp(4px,1.2vw,14px);position:relative}
.cell{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.expr{grid-area:expr;justify-content:flex-start;align-items:flex-start;gap:4px;padding-top:4px}
.dyn{grid-area:dyn}
.time{grid-area:time;justify-content:flex-end;padding-bottom:4px}
.wedge{grid-area:wedge}
.beats{grid-area:beats}
.lyric{grid-area:lyric;overflow:hidden}
.next{grid-area:next;justify-content:flex-start;padding-top:4px}
.cap{font-size:10px;letter-spacing:.14em;color:var(--ink-soft);font-weight:700;text-transform:uppercase}

.expr .item{font-family:var(--font-dyn);font-style:italic;font-weight:800;font-size:clamp(18px,3.2vw,34px);line-height:1.1;text-align:left;display:flex;align-items:center;gap:6px}
.expr .item.mark{font-family:var(--font-ui);font-style:normal;font-weight:700;font-size:clamp(13px,1.8vw,18px)}
.expr .item svg{width:1.6em;height:1em}

.dynval{font-family:var(--font-dyn);font-style:italic;font-weight:900;font-size:clamp(44px,9vw,108px);line-height:1;letter-spacing:-.02em}

.sig{display:grid;justify-items:center;font-family:var(--font-lyric);font-weight:800;font-size:clamp(22px,4.2vw,44px);line-height:.95}
.sig i{display:block;width:1.2em;height:3px;background:var(--ink);margin:2px 0;border-radius:2px}
.info{margin-top:6px;display:grid;gap:2px;font-family:var(--font-mono);font-size:clamp(11px,1.5vw,14px);color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}

.wedge svg{width:min(100%,300px);height:auto;max-height:100%;overflow:visible}
.wedge .base{stroke:var(--ink-faint)}
.wedge .prog{stroke:var(--ink)}
.wedge .wlab{font-family:var(--font-dyn);font-style:italic;font-weight:800;font-size:clamp(14px,2vw,20px);color:var(--ink-soft);margin-top:2px}

.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.2vw,12px);min-height:clamp(18px,3vw,30px);align-items:center}
.dot{width:clamp(16px,2.8vw,28px);aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);box-sizing:border-box;transition:background-color .08s}
.dot.on{background:var(--ink)}
.dot.half{border-style:dotted;border-color:var(--ink-soft)}
.dot.half.on{background:var(--ink-faint)}

.word{font-family:var(--font-lyric);font-weight:800;line-height:1;white-space:nowrap;letter-spacing:-.01em}
.word .up{color:var(--ink-faint)}
.hint{font-size:clamp(14px,2vw,18px);color:var(--ink-soft);line-height:1.8}

.nextbox{border:2px solid var(--ink-faint);border-radius:999px;padding:clamp(6px,1vw,10px) clamp(14px,2.2vw,26px);display:grid;justify-items:center;gap:0;transition:opacity .2s}
.nextbox .cap{color:var(--accent)}
.nextval{font-family:var(--font-dyn);font-style:italic;font-weight:900;font-size:clamp(28px,5vw,60px);line-height:1.05}
.nextwhen{font-size:11px;color:var(--ink-soft);font-weight:700}
.nextbox.off{opacity:0}

/* ---- player ---- */
.player{display:grid;gap:6px;padding-bottom:env(safe-area-inset-bottom,0px)}
.seek{display:flex;align-items:center;gap:10px}
.seek input{flex:1;min-width:0;accent-color:var(--frame);height:28px}
.seek .pos{flex:none;width:6.8em;font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.ctrls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto minmax(0,1fr) minmax(0,1fr);align-items:center;gap:6px;color:var(--control)}
.ctrls button{border:0;background:none;color:var(--control);display:grid;place-items:center;padding:6px}
.speed{flex:none;border:0;background:none;color:var(--control);font-family:var(--font-lyric);font-weight:800;font-size:18px;min-width:3.2em;padding:6px 0;text-align:left}
.tbtn{gap:2px;min-width:0;padding:6px 0!important;border-radius:12px}
.tbtn svg{width:26px;height:26px}
.tbtn b{font-size:10px;font-weight:700;letter-spacing:0;white-space:nowrap}
.tbtn:disabled{opacity:.35}
.tbtn.toggle[aria-pressed="true"]{background:var(--control);color:var(--ground)}
/* shared popup menu (speed / part / default part / verse) */
.menu{position:fixed;z-index:30;display:grid;min-width:7em;max-width:calc(100vw - 16px);max-height:60vh;overflow:auto;padding:6px;border-radius:14px;background:var(--sheet);box-shadow:0 8px 28px rgba(5,25,31,.28)}
.menu button{border:0;background:none;color:var(--sheet-ink);font-family:var(--font-ui);font-weight:700;font-size:16px;text-align:left;padding:10px 14px;border-radius:9px;white-space:nowrap}
.menu.mono button{font-family:var(--font-mono);font-weight:500;font-size:17px}
.menu button.cur{background:var(--sheet-ink);color:var(--sheet)}
.field{display:flex;align-items:center;justify-content:space-between;gap:8px;height:48px;padding:0 14px;border-radius:10px;border:0;background:var(--line);color:var(--sheet-ink);font-weight:700;font-size:16px;text-align:left}
.voicerow{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;min-width:0}
.voicerow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field.sm{height:36px;font-size:13px}
.play{width:72px;height:72px;border-radius:50%;background:var(--control)!important;color:var(--ground)!important}
.play svg{width:32px;height:32px}

/* ---- sheets ---- */
.scrim{position:fixed;inset:0;background:rgba(5,25,31,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding-inline:0}
.sheet{background:var(--sheet);color:var(--sheet-ink);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.sheet h2{margin:0;font-size:17px;font-weight:700}
.sheet .row{display:grid;gap:6px}
.sheet label.l{font-size:13px;font-weight:700;color:var(--ink-soft)}
.sheet .sub{font-size:12px;color:var(--ink-soft);line-height:1.6;margin:0}
.big{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;border:0;background:var(--ink);color:var(--sheet);font-weight:700;font-size:16px}
.textbtn{justify-self:start;border:0;background:none;padding:6px 0;font-size:14px;font-weight:700;color:var(--sheet-ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
input[type=range]{width:100%;accent-color:var(--ink)}
.close{justify-self:end;border:0;background:none;font-weight:700;color:var(--ink-soft);padding:6px}
.err{background:var(--accent);color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6}

/* ---- portrait ---- */
@media (max-aspect-ratio: 1/1){
  .stage{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);
    grid-template-rows:auto auto auto minmax(0,1fr);
    grid-template-areas:"dyn wedge next" "expr expr time" "beats beats beats" "lyric lyric lyric"}
  .expr{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;min-height:34px}
  .time{display:grid;grid-template-columns:auto 7em;column-gap:10px;justify-content:end;align-items:center;padding-bottom:0}
  .sig{font-size:24px}
  .info{margin-top:0;justify-items:start;text-align:left}
  .dynval{font-size:clamp(40px,14vw,72px)}
  .nextval{font-size:clamp(24px,8vw,40px)}
}
@media (prefers-reduced-motion: reduce){ .dot,.nextbox{transition:none} }

/* ---- lyrics export ---- */
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--sheet-ink)}
#lyrText{width:100%;min-height:12em;resize:vertical;border:0;border-radius:10px;background:var(--line);color:var(--sheet-ink);padding:12px;font-family:var(--font-ui);font-size:15px;line-height:1.7}
.btns{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.btns .big{height:48px;font-size:14px;padding:0 6px}
.big.alt{background:var(--line);color:var(--sheet-ink)}
.printonly{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff;color:#000;padding:0}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important;font-family:var(--font-ui);color:#000}
  #printArea h1{font-size:18pt;margin:0 0 4pt}
  #printArea .who{font-size:10pt;color:#444;margin:0 0 14pt}
  #printArea h2{font-size:12pt;margin:14pt 0 4pt}
  #printArea p{font-size:12pt;line-height:1.8;margin:0}
  #printArea .n{display:inline-block;min-width:3em;color:#666;font-family:var(--font-mono);font-size:9pt}
}
</style>

<div class="app">
  <div class="top">
    <button class="chip song" id="songBtn" aria-label="曲を選ぶ">
      <span class="t" id="songName">—</span>
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>

    <button class="iconbtn" id="setBtn" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>

  <div class="player">

      <button class="tbtn" id="prevBtn" aria-label="前の歌い出しへ"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 7L4 16l12 9zM28 7L16 16l12 9z" fill="currentColor"/></svg><b>前の歌い出し</b></button>
      <button class="play" id="playBtn" aria-label="再生"><svg viewBox="0 0 32 32" id="playIco" aria-hidden="true"><path d="M10 6l17 10-17 10z" fill="currentColor"/></svg></button>
      <button class="tbtn" id="nextBtn" aria-label="次の歌い出しへ"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 7l12 9-12 9zM16 7l12 9-12 9z" fill="currentColor"/></svg><b>次の歌い出し</b></button>
      <button class="tbtn toggle" id="metroBtn" aria-pressed="false" aria-label="メトロノーム"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12.5 4h7l6 24h-19z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 22L23 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M9 22h14" stroke="currentColor" stroke-width="2.4"/></svg><b>メトロノーム</b></button>
    </div>
  </div>
</div>

<div class="scrim" id="libScrim" hidden>
  <div class="sheet" role="dialog" aria-label="曲">
    <button class="close" data-close>閉じる</button>
    <h2>曲を開く</h2>
    <div class="row">
      <span class="l">楽譜（.mxl / .musicxml）</span>
      <label class="big" for="fileIn">＋ 楽譜を選ぶ</label>
      <input type="file" id="fileIn" hidden>
    </div>

      <span class="l">音源（mp3 / wav）</span>

</div>

<div class="scrim" id="setScrim" hidden>
  <div class="sheet" role="dialog" aria-label="設定">
    <button class="close" data-close>閉じる</button>
    <h2>設定</h2>
    <div class="row" id="verseRow" hidden><span class="l">歌詞（何番）</span><button class="field" id="verseBtn" aria-haspopup="menu" aria-expanded="false">1番<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>
    <label class="check" for="synthOn" id="synthRow" hidden><input type="checkbox" id="synthOn">音源に合成音も重ねる</label>
    <div class="row" id="myVolRow"><label class="l" for="myVol">自分のパートの音量</label><input type="range" id="myVol" min="0" max="100" value="90"></div>
    <div class="row" id="otherVolRow"><label class="l" for="otherVol">ほかのパートの音量</label><input type="range" id="otherVol" min="0" max="100" value="35"></div>

    <div class="row"><span class="l">曲を開いたときのパート</span>
      <button class="field" id="defPartBtn" aria-haspopup="menu" aria-expanded="false">ソプラノ<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
    <div class="row"><span class="l">歌詞</span>
      <button class="field" id="lyrOpen">今のパートの歌詞を書き出す<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
    <a class="textbtn" id="guideLink" href="guide.html" target="_blank" rel="noopener">使い方を見る</a>
  </div>
</div>

<div class="scrim" id="lyrScrim" hidden>
  <div class="sheet" role="dialog" aria-label="歌詞を書き出す">
    <button class="close" data-close>閉じる</button>
    <h2 id="lyrTitle">歌詞を書き出す</h2>

    <textarea id="lyrText" readonly rows="10" aria-label="書き出す歌詞"></textarea>
    <div class="btns">
      <button class="big" id="lyrCopy">コピー</button>
      <button class="big alt" id="lyrTxt">テキストで保存</button>
      <button class="big alt" id="lyrPdf">PDFで保存</button>
    </div>
    <p class="sub" id="lyrMsg">PDFは印刷画面で「PDFとして保存」を選んでください。</p>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const EPS = 1e-4;
const kids = (el, tag) => el ? [...el.children].filter(c => c.tagName === tag) : [];
const kid = (el, tag) => el ? [...el.children].find(c => c.tagName === tag) || null : null;
const txt = (el, tag) => { const k = kid(el, tag); return k ? k.textContent.trim() : null; };
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ================= file reading ================= */
async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder();
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error("zip");
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const entries = {};
  for (let n = 0; n < count; n++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    entries[dec.decode(u8.subarray(p + 46, p + 46 + nl))] = { method, csize, off };
    p += 46 + nl + el + cl;
  }
  async function read(name){
    const e = entries[name]; if (!e) return null;
    const start = e.off + 30 + dv.getUint16(e.off + 26, true) + dv.getUint16(e.off + 28, true);
    const data = u8.slice(start, start + e.csize);
    if (e.method === 0) return dec.decode(data);
    if (e.method === 8){
      const s = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return await new Response(s).text();
    }
    throw new Error("zip-method");
  }
  let root = null;
  const cont = await read("META-INF/container.xml");
  if (cont){ const d = new DOMParser().parseFromString(cont, "application/xml"); root = d.querySelector("rootfile")?.getAttribute("full-path"); }
  if (!root || !entries[root]) root = Object.keys(entries).find(k => !k.startsWith("META-INF") && /\.(xml|musicxml)$/i.test(k));
  if (!root) throw new Error("no-score");
  return read(root);
}
async function bytesToXml(buf){
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0x50 && u8[1] === 0x4b) return unzip(buf);
  if ((u8[0] === 0xff && u8[1] === 0xfe) || (u8[0] === 0xfe && u8[1] === 0xff)) return new TextDecoder("utf-16").decode(u8);
  return new TextDecoder().decode(u8);
}

/* ================= MusicXML parsing ================= */
const STEP = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const UNIT_Q = { whole:4, half:2, quarter:1, eighth:.5, "16th":.25, "32nd":.125 };

function parsePart(partEl){
  let div = 1;
  const measures = [];
  for (const mEl of kids(partEl, "measure")){
    const m = { number: mEl.getAttribute("number") || "", implicit: mEl.getAttribute("implicit") === "yes",
      notes: [], dirs: [], time: null, repStart: false, repEnd: false, repTimes: 2, endNums: null, endStop: false, len: 0 };
    let cur = 0, max = 0, lastStart = 0;
    const addDir = (d, off) => { d.q = (cur + off) / div; m.dirs.push(d); };
    for (const c of mEl.children){
      const tag = c.tagName;
      if (tag === "attributes"){
        const d = txt(c, "divisions"); if (d) div = parseFloat(d) || 1;
        const t = kid(c, "time");
        if (t && kid(t, "beats")){
          const beats = (txt(t, "beats") || "4").split("+").reduce((a, b) => a + (parseFloat(b) || 0), 0);
          m.time = { beats, type: parseFloat(txt(t, "beat-type")) || 4, label: txt(t, "beats") };
        }
      } else if (tag === "note"){
        if (kid(c, "grace")) continue;
        const dur = parseFloat(txt(c, "duration")) || 0;
        const chord = !!kid(c, "chord");
        const start = chord ? lastStart : cur;
        if (!chord){ lastStart = cur; cur += dur; }
        max = Math.max(max, cur);
        if (kid(c, "cue")) continue;
        const pitch = kid(c, "pitch");
        const n = { s: start / div, d: dur / div, rest: !pitch, chord, voice: (txt(c, "voice") || "1") + "/" + (txt(c, "staff") || "1"),
          midi: 0, tieStart: false, tieStop: false, lyrics: [], slurStart: [], slurStop: [], marks: [] };
        if (pitch) n.midi = 12 * (parseInt(txt(pitch, "octave")) + 1) + STEP[txt(pitch, "step")] + (parseFloat(txt(pitch, "alter")) || 0);
        for (const t of kids(c, "tie")){ if (t.getAttribute("type") === "start") n.tieStart = true; else n.tieStop = true; }
        for (const l of kids(c, "lyric")){
          const texts = kids(l, "text").map(x => x.textContent);
          if (!texts.length) continue;
          n.lyrics.push({ num: l.getAttribute("number") || "1", text: texts.join(" "), syl: txt(l, "syllabic") || "single", extend: !!kid(l, "extend") });
        }
        for (const nt of kids(c, "notations")){
          for (const t of kids(nt, "tied")){ if (t.getAttribute("type") === "start") n.tieStart = true; else if (t.getAttribute("type") === "stop") n.tieStop = true; }
          for (const s of kids(nt, "slur")){ const num = s.getAttribute("number") || "1"; if (s.getAttribute("type") === "start") n.slurStart.push(num); else if (s.getAttribute("type") === "stop") n.slurStop.push(num); }
          if (kid(nt, "fermata")) n.marks.push("fermata");
          for (const a of kids(nt, "articulations")) for (const x of a.children) n.marks.push(x.tagName);
        }
        m.notes.push(n);
      } else if (tag === "backup"){ cur -= parseFloat(txt(c, "duration")) || 0; }
      else if (tag === "forward"){ cur += parseFloat(txt(c, "duration")) || 0; max = Math.max(max, cur); }
      else if (tag === "direction"){
        const off = parseFloat(txt(c, "offset")) || 0;
        // marks hidden in the notation editor (print-object="no") still drive timing, but are never shown
        const hidden = c.getAttribute("print-object") === "no" || !!c.querySelector('[print-object="no"]');
        for (const dt of kids(c, "direction-type")){
          const met = kid(dt, "metronome");
          if (met && txt(met, "per-minute")){
            let u = UNIT_Q[txt(met, "beat-unit")] || 1; if (kid(met, "beat-unit-dot")) u *= 1.5;
            const pm = parseFloat(txt(met, "per-minute"));
            if (pm) addDir({ kind: "metro", unit: u, bpm: pm * u, hidden }, off);
          }
          if (hidden) continue;
          for (const dy of kids(dt, "dynamics")) for (const x of dy.children)
            addDir({ kind: "dyn", label: x.tagName === "other-dynamics" ? x.textContent.trim() : x.tagName }, off);
          for (const w of kids(dt, "wedge")) addDir({ kind: "wedge", type: w.getAttribute("type"), num: w.getAttribute("number") || "1" }, off);
          const words = kids(dt, "words").map(w => w.textContent).join("").trim();
          if (words) addDir({ kind: "words", text: words }, off);
          for (const ds of kids(dt, "dashes")) addDir({ kind: "dashes", type: ds.getAttribute("type"), num: ds.getAttribute("number") || "1" }, off);
        }
        const snd = kid(c, "sound");
        if (snd && snd.getAttribute("tempo")) addDir({ kind: "tempo", bpm: parseFloat(snd.getAttribute("tempo")) }, off);
        if (snd && snd.getAttribute("dynamics")) addDir({ kind: "vel", v: parseFloat(snd.getAttribute("dynamics")) }, off);
      } else if (tag === "sound" && c.getAttribute("tempo")){
        addDir({ kind: "tempo", bpm: parseFloat(c.getAttribute("tempo")) }, 0);
      } else if (tag === "barline"){
        const r = kid(c, "repeat");
        if (r){ if (r.getAttribute("direction") === "forward") m.repStart = true; else { m.repEnd = true; m.repTimes = parseInt(r.getAttribute("times")) || 2; } }
        const e = kid(c, "ending");
        if (e){
          const ty = e.getAttribute("type");
          if (ty === "start") m.endNums = (e.getAttribute("number") || "1").split(/[,\s]+/).map(Number).filter(Boolean);
          else m.endStop = true;
        }
      }
    }
    m.len = max / div;
    measures.push(m);
  }
  return measures;
}

function unroll(nM, bars){
  const order = []; let i = 0, repStart = 0, pass = 1; const jumps = {};
  while (i < nM && order.length < 5000){
    const b = bars[i];
    if (b.repStart && pass === 1) repStart = i;
    if (b.endNums && !b.endNums.includes(pass)){
      let j = i; while (j < nM - 1 && !bars[j].endStop) j++;
      i = j + 1; continue;
    }
    order.push(i);
    if (b.repEnd){
      const cnt = jumps[i] || 0;
      if (cnt < b.repTimes - 1){ jumps[i] = cnt + 1; pass = cnt + 2; i = repStart; continue; }
      pass = 1; repStart = i + 1;
    }
    i++;
  }
  return order;
}

function cleanSyl(s){
  s = s.replace(/[-‐‑‒–—―_~]/g, "");
  if (/[A-Za-zÀ-ÿ]/.test(s)) s = s.replace(/ー/g, "");
  return s;
}
function cleanWord(s){ return s.replace(/^[,.;:"“”'‘’()\s]+|[,.;:"“”'‘’()\s]+$/g, "") || s; }

function buildSong(xml){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("xml");
  const root = doc.documentElement;
  if (root.tagName === "score-timewise") throw new Error("timewise");
  if (root.tagName !== "score-partwise") throw new Error("not-musicxml");

  const meta = {};
  for (const sp of root.querySelectorAll("part-list > score-part")){
    meta[sp.getAttribute("id")] = { name: txt(sp, "part-name") || txt(sp, "part-abbreviation") || sp.getAttribute("id"),
      sound: sp.querySelector("instrument-sound")?.textContent || "" };
  }
  const parts = kids(root, "part").map(pe => {
    const id = pe.getAttribute("id"), mm = meta[id] || { name: id, sound: "" };
    const nm = mm.name.replace(/\s+/g, " ").trim();
    let kind = "voice";
    if (/keyboard|piano/i.test(mm.sound) || /piano|pf|ピアノ|organ|オルガン/i.test(nm)) kind = "piano";
    else if (/^strings|^brass|^wind|^pluck/i.test(mm.sound) || /cello|violin|viola|bass guitar|チェロ/i.test(nm)) kind = "string";
    return { id, name: nm, kind, measures: parsePart(pe) };
  });
  if (!parts.length) throw new Error("no-parts");

  const nM = Math.max(...parts.map(p => p.measures.length));
  const bars = [], mLen = [], sig = [], numbers = [];
  let lastSig = { beats: 4, type: 4, label: "4" };
  for (let i = 0; i < nM; i++){
    const ms = parts.map(p => p.measures[i]).filter(Boolean);
    const t = ms.find(m => m.time)?.time; if (t) lastSig = t;
    sig[i] = lastSig;
    const full = lastSig.beats * 4 / lastSig.type;
    const played = Math.max(0, ...ms.map(m => m.len));
    mLen[i] = played > EPS ? (ms.some(m => m.implicit) ? played : Math.max(played, full)) : full;
    bars[i] = { repStart: ms.some(m => m.repStart), repEnd: ms.some(m => m.repEnd), repTimes: Math.max(2, ...ms.map(m => m.repTimes)),
      endNums: ms.find(m => m.endNums)?.endNums || null, endStop: ms.some(m => m.endStop) };
    numbers[i] = ms[0]?.number || String(i + 1);
  }
  const order = unroll(nM, bars);
  const startQ = []; let acc = 0;
  order.forEach((mi, k) => { startQ[k] = acc; acc += mLen[mi]; });
  const totalQ = acc;

  for (const p of parts){
    const notes = [], dirs = [];
    order.forEach((mi, k) => {
      const m = p.measures[mi]; if (!m) return;
      const b = startQ[k];
      for (const n of m.notes) notes.push({ ...n, slurStart: [...n.slurStart], slurStop: [...n.slurStop], marks: [...n.marks], s: b + n.s, e: b + n.s + n.d, k });
      for (const d of m.dirs) dirs.push({ ...d, q: b + d.q, k });
    });
    notes.sort((a, b) => a.s - b.s);
    dirs.sort((a, b) => a.q - b.q);
    p.dirs = dirs;
    p.notes = notes;
    p.sounds = mergeTies(notes);
    p.lyricCount = notes.reduce((a, n) => a + n.lyrics.length, 0);
    p.verses = [...new Set(notes.flatMap(n => n.lyrics.map(l => l.num)))].sort();
    p.dyns = dirs.filter(d => d.kind === "dyn").map(d => ({ q: d.q, k: d.k, label: d.label }));
    p.wedges = pairWedges(dirs, startQ, order, mLen, totalQ);
  }

  // tempo
  const tempoEv = [], shownTempo = [];
  let metroUnit = null;
  for (const p of parts) for (const d of p.dirs){
    if (d.kind === "tempo") tempoEv.push({ q: d.q, bpm: d.bpm });
    if (d.kind === "metro"){
      tempoEv.push({ q: d.q, bpm: d.bpm, weak: true });
      if (!d.hidden){ shownTempo.push({ q: d.q, bpm: d.bpm }); if (metroUnit == null) metroUnit = d.unit; }
    }
  }
  shownTempo.sort((a, b) => a.q - b.q);
  tempoEv.sort((a, b) => a.q - b.q || (a.weak ? 1 : 0) - (b.weak ? 1 : 0));
  const tempo = [];
  for (const t of tempoEv){
    const last = tempo[tempo.length - 1];
    if (last && Math.abs(last.q - t.q) < EPS) continue;
    tempo.push({ q: t.q, bpm: t.bpm });
  }
  const hasTempo = tempo.length > 0;
  if (!tempo.length || tempo[0].q > EPS) tempo.unshift({ q: 0, bpm: hasTempo ? tempo[0].bpm : 120 });

  // expressions (union of all parts)
  const byKey = new Map();
  for (const p of parts){
    const openDash = {};
    let lastWords = null;
    for (const d of p.dirs){
      if (d.kind === "words"){
        const key = Math.round(d.q * 1000) + "|" + d.text;
        if (!byKey.has(key)) byKey.set(key, { s: d.q, e: null, text: d.text, k: d.k });
        lastWords = byKey.get(key);
      } else if (d.kind === "dashes"){
        if (d.type === "start"){ if (lastWords && Math.abs(lastWords.s - d.q) < EPS) openDash[d.num] = lastWords; }
        else if (d.type === "stop" && openDash[d.num]){ openDash[d.num].e = Math.max(openDash[d.num].e || 0, d.q); delete openDash[d.num]; }
      }
    }
  }
  const ex = [...byKey.values()].sort((a, b) => a.s - b.s);
  ex.forEach((e, i) => {
    if (e.e == null){
      const cap = startQ[Math.min(e.k + 4, startQ.length)] ?? totalQ;
      const nx = ex.slice(i + 1).find(o => o.s > e.s + EPS);
      e.e = Math.min(cap ?? totalQ, nx ? nx.s : totalQ);
    }
  });

  const title = (root.querySelector("work > work-title")?.textContent || "").trim();
  const credTitle = [...root.querySelectorAll("credit")].find(c => txt(c, "credit-type") === "title")?.querySelector("credit-words")?.textContent?.trim();
  return { parts, order, startQ, mLen, sig, numbers, totalQ, tempo, baseBpm: tempo[0].bpm, hasTempo, metroUnit, shownTempo, exprs: ex,
    title: credTitle || (title && !/無題|untitled/i.test(title) ? title : "") };
}

function mergeTies(notes){
  const out = [], open = new Map();
  for (const n of notes){
    if (n.rest) continue;
    const key = n.voice + ":" + n.midi;
    const o = open.get(key);
    if (n.tieStop && o && Math.abs(o.e - n.s) < 1e-3){
      o.e = n.e;
      for (const x of n.slurStop){ const i = o.slurStart.indexOf(x); if (i >= 0) o.slurStart.splice(i, 1); else o.slurStop.push(x); }
      o.slurStart.push(...n.slurStart);
      if (!n.tieStart) open.delete(key);
      continue;
    }
    const snd = { ...n };
    out.push(snd);
    if (n.tieStart) open.set(key, snd); else open.delete(key);
  }
  return out;
}

function pairWedges(dirs, startQ, order, mLen, totalQ){
  const res = [], open = {};
  for (const d of dirs){
    if (d.kind !== "wedge") continue;
    if (d.type === "crescendo" || d.type === "diminuendo"){ const w = { s: d.q, e: null, type: d.type, k: d.k }; open[d.num] = w; res.push(w); }
    else if (d.type === "stop" && open[d.num]){ open[d.num].e = d.q; delete open[d.num]; }
  }
  for (const w of res) if (w.e == null || w.e <= w.s + EPS) w.e = Math.min(totalQ, (startQ[w.k] ?? w.s) + (mLen[order[w.k]] || 4));
  return res;
}

/* ================= derived tracks for the chosen part ================= */
function buildTrack(song, pi, verse){
  const p = song.parts[pi];
  // melodic line: the voice carrying lyrics (or the busiest voice)
  const vc = {};
  for (const s of p.sounds) vc[s.voice] = (vc[s.voice] || 0) + 1 + (s.lyrics.some(l => l.num === verse) ? 100 : 0);
  const voice = Object.keys(vc).sort((a, b) => vc[b] - vc[a])[0];
  const line = p.sounds.filter(s => s.voice === voice && !s.chord);

  const segs = [], marks = [], openSlur = new Set();
  let cur = null;
  for (const n of line){
    const lyr = n.lyrics.find(l => l.num === verse);
    const inSlur = openSlur.size > 0;
    if (lyr){ cur = { s: n.s, e: n.e, text: cleanSyl(lyr.text), syl: lyr.syl, extend: lyr.extend }; segs.push(cur); }
    else if (cur && Math.abs(n.s - cur.e) < 1e-3 && (inSlur || cur.extend)) cur.e = n.e;
    else { cur = { s: n.s, e: n.e, text: "", syl: "none" }; segs.push(cur); }
    for (const x of n.slurStop) openSlur.delete(x);
    for (const x of n.slurStart) openSlur.add(x);
  }
  // marks belong to the written note they sit on, not to the whole tied chain
  for (const n of p.notes) if (!n.rest && !n.chord && n.voice === voice && n.marks.length) marks.push({ s: n.s, e: n.e, marks: [...new Set(n.marks)] });
  // beat circles count each held pitch (tied notes joined), restarting when the pitch moves
  const holds = line.map(n => ({ s: n.s, e: n.e, ticks: beatTicks(n.s, n.e) }));
  const words = []; let w = null;
  for (const sg of segs){
    if (!sg.text) continue;
    if (sg.syl === "begin"){ w = { syls: [sg] }; words.push(w); }
    else if (sg.syl === "middle" || sg.syl === "end"){ if (!w){ w = { syls: [] }; words.push(w); } w.syls.push(sg); if (sg.syl === "end") w = null; }
    else { words.push({ syls: [sg] }); w = null; }
  }
  for (const wd of words){
    wd.s = wd.syls[0].s; wd.e = wd.syls[wd.syls.length - 1].e;
    wd.pieces = wd.syls.map(x => x.text);
    // tidy punctuation at the ends of the whole word
    const joined = wd.pieces.join("");
    wd.full = joined;
    const trimmed = cleanWord(joined);
    if (trimmed !== joined){
      const lead = joined.indexOf(trimmed); const tailCut = joined.length - lead - trimmed.length;
      let a = lead; wd.pieces = wd.pieces.map(t => { const cut = Math.min(a, t.length); a -= cut; return t.slice(cut); });
      let b = tailCut; for (let i = wd.pieces.length - 1; i >= 0 && b > 0; i--){ const cut = Math.min(b, wd.pieces[i].length); wd.pieces[i] = wd.pieces[i].slice(0, wd.pieces[i].length - cut); b -= cut; }
    }
    wd.text = wd.pieces.join("");
  }

  // dynamics & wedges: this part's own marks, else borrowed from the other parts
  const pick = key => {
    if (p[key].length) return p[key];
    const others = song.parts.filter(o => o[key].length);
    const pool = (others.some(o => o.lyricCount) ? others.filter(o => o.lyricCount) : others).flatMap(o => o[key]);
    const seen = new Set();
    return pool.sort((a, b) => (a.q ?? a.s) - (b.q ?? b.s)).filter(x => { const k = Math.round((x.q ?? x.s) * 1000) + (x.label || x.type); if (seen.has(k)) return false; seen.add(k); return true; });
  };
  const dyns = pick("dyns").slice().sort((a, b) => a.q - b.q);
  const wedges = pick("wedges").slice().sort((a, b) => a.s - b.s);
  return { segs, holds, words: words.filter(w => w.text), marks, dyns, wedges };
}

/* ================= time mapping ================= */
let tempoScale = 1;
function secOf(q){
  const t = S.song.tempo; let sec = 0;
  for (let i = 0; i < t.length; i++){
    const end = i + 1 < t.length ? t[i + 1].q : Infinity;
    const spq = 60 / (t[i].bpm * tempoScale);
    if (q <= end){ return sec + (q - t[i].q) * spq; }
    sec += (end - t[i].q) * spq;
  }
  return sec;
}
function qOf(sec){
  const t = S.song.tempo; let acc = 0;
  for (let i = 0; i < t.length; i++){
    const end = i + 1 < t.length ? t[i + 1].q : Infinity;
    const spq = 60 / (t[i].bpm * tempoScale);
    const segSec = (end - t[i].q) * spq;
    if (sec <= acc + segSec) return t[i].q + (sec - acc) / spq;
    acc += segSec;
  }
  return S.song.totalQ;
}
function bpmAt(q){ const t = S.song.tempo; let b = t[0].bpm; for (const x of t){ if (x.q <= q + EPS) b = x.bpm; else break; } return b * tempoScale; }
function lastLE(arr, v, key){ let lo = 0, hi = arr.length - 1, r = -1; while (lo <= hi){ const m = (lo + hi) >> 1; if (arr[m][key] <= v + EPS){ r = m; lo = m + 1; } else hi = m - 1; } return r; }
function measureAt(q){ const a = S.song.startQ; let lo = 0, hi = a.length - 1, r = 0; while (lo <= hi){ const m = (lo + hi) >> 1; if (a[m] <= q + EPS){ r = m; lo = m + 1; } else hi = m - 1; } return r; }
// Moments a held note's circles turn ●: the note's start, then every beat line of the bar.
// A sliver of a beat (< half) at either end is folded into its neighbour, so an off-beat
// entry still counts along with the pulse the singer hears.
function beatTicks(s, e){
  const song = S.song, ticks = [s];
  for (let k = measureAt(s); k < song.order.length && song.startQ[k] < e - EPS; k++){
    const bq = beatQAt(k), m0 = song.startQ[k], mEnd = m0 + song.mLen[song.order[k]];
    for (let b = m0; b < mEnd - EPS; b += bq) if (b > s + EPS && b < e - EPS) ticks.push(b);
  }
  const bq = beatQAt(measureAt(s));
  if (ticks.length > 1 && ticks[1] - s < bq / 2 - EPS) ticks.splice(1, 1);
  if (ticks.length > 1 && e - ticks[ticks.length - 1] < bq / 2 - EPS) ticks.pop();
  return ticks;
}
function beatQAt(k){
  if (S.song.metroUnit) return S.song.metroUnit;
  const sg = S.song.sig[S.song.order[k]];

function render(){

  const on = !!S.voice, synth = !on || S.synthWithVoice;

  $("audioAdd").hidden = !S.song || S.songId === "demo";
  $("synthRow").hidden = !on; $("synthOn").checked = S.synthWithVoice;
  $("myVolRow").hidden = !synth; $("otherVolRow").hidden = !synth;
}
function selectPart(i){
  const keep = S.song ? qOf(nowSec()) : 0;
  const was = S.playing; if (was) pause();
  S.part = i;
  const p = S.song.parts[i];
  if (!p.verses.includes(S.verse)) S.verse = p.verses[0] || "1";
  $("partName").textContent = p.name;
  $("verseBtn").firstChild.textContent = S.verse + "番";
  $("verseRow").hidden = p.verses.length < 2;
  S.track = buildTrack(S.song, i, S.verse);
  buildSkips();
  buildPlayback();
  S.pos0 = secOf(keep);
  for (const k in last) delete last[k];
  if (was) play(); else render();
}

async function openBytes(buf, name, id){
  const xml = await bytesToXml(buf);
  const song = buildSong(xml);
  applySong(song, id, name);
}

/* ---- tiny song library (IndexedDB) ---- */
const DB = {
  db: null,
  open(){ return new Promise(res => { try { const r = indexedDB.open("lyricflash", 1); r.onupgradeneeded = () => r.result.createObjectStore("songs", { keyPath: "id" }); r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false); } catch(e){ res(false); } }); },
  tx(mode){ return this.db.transaction("songs", mode).objectStore("songs"); },
  get(id){ return new Promise(res => { if (!this.db) return res(null); try { const r = this.tx("readonly").get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch(e){ res(null); } }); },
  put(v){ return new Promise(res => { if (!this.db) return res(false); try { const r = this.tx("readwrite").put(v); r.onsuccess = () => res(true); r.onerror = () => res(false); } catch(e){ res(false); } }); },
  del(id){ return new Promise(res => { if (!this.db) return res(false); try { const r = this.tx("readwrite").delete(id); r.onsuccess = () => res(true); r.onerror = () => res(false); } catch(e){ res(false); } }); },
  clear(){ return new Promise(res => { if (!this.db) return res(false); try { const r = this.tx("readwrite").clear(); r.onsuccess = () => res(true); r.onerror = () => res(false); } catch(e){ res(false); } }); }
};

// Only the most recently opened song is kept, so the app reopens where you left off.
// Organizing song files is left to the phone's own file app.
async function loadDemo(){ await openBytes(new TextEncoder().encode(demoXml()).buffer, "サンプル曲（Evening Song）", "demo"); }
async function loadLast(){
  const rec = await DB.get("last"); if (!rec) return false;
  await openBytes(rec.data, rec.name, rec.songId); return true;
}
function showErr(msg){ const e = $("err"); e.textContent = msg; e.hidden = !msg; }
// 楽譜 (score) and 音源 (audio) are picked separately; the audio belongs to the open score
$("fileIn").addEventListener("change", async ev => {
  const score = ev.target.files[0]; ev.target.value = "";
  if (!score) return;
  showErr("");
  try {
    const buf = await score.arrayBuffer();
    const name = score.name.replace(/\.(mxl|musicxml|xml)$/i, "");
    const songId = "f:" + name;
    await openBytes(buf, name, songId);
    const prev = await DB.get("last");
    if (!prev || prev.songId !== songId) await DB.clear();   // a new song drops the old song and its audio
    await DB.put({ id: "last", songId, name, data: buf });
    closeSheets();
  } catch(e){
    showErr(e.message === "timewise" ? "この形式（score-timewise）にはまだ対応していません。MuseScoreで開き直して MusicXML として書き出してください。"
      : "楽譜を読み込めませんでした。MuseScoreなどの「書き出し → MusicXML」で作った .mxl か .musicxml ファイルを選んでください。");
  }
});
$("audioIn").addEventListener("change", async ev => {
  const audio = ev.target.files[0]; ev.target.value = "";
  if (!audio || !S.song) return;
  showErr("");
  if (audio.type && !new Audio().canPlayType(audio.type)){ showErr("この音源はこの端末では再生できません。mp3 か wav を選んでください。"); return; }
  attachVoice(audio, audio.name);
  await DB.put({ id: "voice:" + S.songId, blob: audio, name: audio.name });
  closeSheets();
});
$("voiceDel").onclick = async () => {
  if (S.playing) pause();
  detachVoice(); await DB.del("voice:" + S.songId);
  updateVoiceUi(); render();
};

/* ================= demo score (original, for trying the app) ================= */
function demoXml(){
  const V = [
    [["r",1],["E4",1,"Sing","begin"],["D4",1,"ing","end"],["C4",1,"soft","begin"]],
    [["E4",1,"ly","end"],["G4",3,"light,","single"]],
    [["A4",1,"hold","single"],["G4",1,"the","single"],["F4",1,"long","begin"],["E4",1,"est","end"]],
    [["G4",4,"note","single"]],
    [["r",1],["A4",1,"and","single"],["B4",1,"let","single"],["C5",1,"it","single"]],
    [["C5",2,"ring","single",{slur:"start"}],["B4",1],["A4",1,null,null,{slur:"stop"}]],
    [["G4",2,"a","begin"],["E4",2,"way","end"]],
    [["C4",4,"home.","single",{fermata:1}]]
  ];
  const D = { 0:[["dyn","p"],["words","dolce"]], 2:[["wedge","crescendo"]], 3:[["dyn","mf"]], 5:[["dyn","f"]], 6:[["wedge","diminuendo"],["words","rit.",1]], 7:[["dyn","p"]] };
  const END = { 2:[["wedge","stop"]], 6:[["wedge","stop"]], 7:[["dash","stop"]] };
  const C = [["C3","G3","E4"],["C3","G3","E4"],["F2","C3","A3"],["G2","D3","B3"],["A2","E3","C4"],["F2","C3","A3"],["G2","D3","B3"],["C3","G3","E4"]];
  const P = s => `<pitch><step>${s[0]}</step><octave>${s.slice(1)}</octave></pitch>`;
  const dir = ([t, v, dash]) => t === "dyn" ? `<direction><direction-type><dynamics><${v}/></dynamics></direction-type></direction>`
    : t === "wedge" ? `<direction><direction-type><wedge type="${v}"/></direction-type></direction>`
    : t === "dash" ? `<direction><direction-type><dashes type="stop"/></direction-type></direction>`
    : `<direction><direction-type><words>${v}</words></direction-type>${dash ? '<direction-type><dashes type="start"/></direction-type>' : ""}</direction>`;
  const attrs = `<attributes><divisions>1</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>`;
  let alto = "", pno = "";
  V.forEach((m, i) => {
    alto += `<measure number="${i + 1}">` + (i === 0 ? attrs + `<direction><direction-type><metronome><beat-unit>quarter</beat-unit><per-minute>84</per-minute></metronome></direction-type><sound tempo="84"/></direction>` : "");
    (D[i] || []).forEach(d => alto += dir(d));
    for (const [p, b, ly, syl, ex] of m){
      if (p === "r"){ alto += `<note><rest/><duration>${b}</duration><voice>1</voice></note>`; continue; }
      let not = "";
      if (ex?.slur) not += `<slur type="${ex.slur}"/>`;
      if (ex?.fermata) not += `<fermata/>`;
      alto += `<note>${P(p)}<duration>${b}</duration><voice>1</voice>${not ? `<notations>${not}</notations>` : ""}${ly ? `<lyric number="1"><syllabic>${syl}</syllabic><text>${ly}</text></lyric>` : ""}</note>`;
    }
    (END[i] || []).forEach(d => alto += dir(d));
    alto += `</measure>`;
    pno += `<measure number="${i + 1}">` + (i === 0 ? attrs : "") + C[i].map((p, j) => `<note>${j ? "<chord/>" : ""}${P(p)}<duration>4</duration><voice>1</voice></note>`).join("") + `</measure>`;
  });
  return `<?xml version="1.0"?><score-partwise version="4.0"><work><work-title>Evening Song（サンプル）</work-title></work><part-list>
    <score-part id="P1"><part-name>Alto</part-name><score-instrument id="P1-I1"><instrument-name>Alto</instrument-name><instrument-sound>voice.alto</instrument-sound></score-instrument></score-part>
    <score-part id="P2"><part-name>Piano</part-name><score-instrument id="P2-I1"><instrument-name>Piano</instrument-name><instrument-sound>keyboard.piano</instrument-sound></score-instrument></score-part>
    </part-list><part id="P1">${alto}</part><part id="P2">${pno}</part></score-partwise>`;
}

/* ================= wiring ================= */
let seeking = false;
$("playBtn").onclick = () => S.playing ? pause() : play();
function paintSpeed(){ $("speedBtn").textContent = "×" + S.speed; }
function setSpeed(v){
  const cur = nowSec();
  const was = S.playing; if (was) pause();
  S.speed = v;
  store.set("lf.speed", S.speed); paintSpeed();
  S.pos0 = cur; for (const k in last) delete last[k];
  if (was) play(); else render();
}
// one popup menu shared by every picker (speed, part, default part, verse)
const menu = $("menu");
let menuOwner = null;
function closeMenu(){ menu.hidden = true; if (menuOwner) menuOwner.setAttribute("aria-expanded", "false"); menuOwner = null; }
function openMenu(anchor, items, current, onPick, mono){
  if (menuOwner === anchor){ closeMenu(); return; }
  closeMenu();
  menu.innerHTML = ""; menu.classList.toggle("mono", !!mono);
  for (const it of items){
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("role", "menuitemradio");
    b.textContent = it.label; b.setAttribute("aria-checked", String(it.value === current));
    if (it.value === current) b.className = "cur";
    b.onclick = e => { e.stopPropagation(); closeMenu(); onPick(it.value); };
    menu.appendChild(b);
  }
  menu.hidden = false; menuOwner = anchor; anchor.setAttribute("aria-expanded", "true");
  const r = anchor.getBoundingClientRect(), mh = menu.offsetHeight, mw = menu.offsetWidth;
  const below = window.innerHeight - r.bottom - 8;
  menu.style.top = (below >= mh || r.top < mh + 8 ? r.bottom + 6 : r.top - mh - 6) + "px";
  menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - mw - 8)) + "px";
}
document.addEventListener("click", e => { if (!menu.contains(e.target)) closeMenu(); });
window.addEventListener("resize", closeMenu);
document.addEventListener("scroll", closeMenu, true);
$("speedBtn").onclick = e => { e.stopPropagation(); openMenu(e.currentTarget, SPEEDS.map(v => ({ value: v, label: "×" + v })), S.speed, setSpeed, true); };
$("partBtn").onclick = e => {
  e.stopPropagation();
  openMenu(e.currentTarget, S.song.parts.map((p, i) => ({ value: i, label: p.name })), S.part, i => { store.set("lf.part." + S.songId, i); selectPart(i); });
};
const DEF_PARTS = [{ value: "S", label: "ソプラノ" }, { value: "A", label: "アルト" }, { value: "T", label: "テノール" }, { value: "B", label: "バス" }];
const defPartNow = () => (VOICE_RE[store.get("lf.defaultPart", "S")] ? store.get("lf.defaultPart", "S") : "S");
const paintDefPart = () => { $("defPartBtn").firstChild.textContent = DEF_PARTS.find(d => d.value === defPartNow()).label; };
$("defPartBtn").onclick = e => {
  e.stopPropagation();
  openMenu(e.currentTarget, DEF_PARTS, defPartNow(), v => {
    store.set("lf.defaultPart", v); paintDefPart();
    if (!S.song) return;
    store.set("lf.part." + S.songId, null);
    selectPart(defaultPartIndex(S.song));
  });
};
$("verseBtn").onclick = e => {
  e.stopPropagation();
  openMenu(e.currentTarget, S.song.parts[S.part].verses.map(v => ({ value: v, label: v + "番" })), S.verse, v => { S.verse = v; selectPart(S.part); });
};
paintDefPart();
el.seek.addEventListener("input", () => { seeking = true; const v = el.seek.value / 1000 * totalSec(); if (!S.playing){ S.pos0 = v; render(); } });
el.seek.addEventListener("change", () => { const v = el.seek.value / 1000 * totalSec(); seeking = false; seek(v); });
$("nextBtn").onclick = nextEntry;
$("prevBtn").onclick = prevEntry;
$("startBtn").onclick = () => seek(0);
$("metroBtn").onclick = e => { S.metro = !S.metro; e.currentTarget.setAttribute("aria-pressed", String(S.metro)); };
$("synthOn").onchange = e => { S.synthWithVoice = e.target.checked; store.set("lf.synthWithVoice", S.synthWithVoice); updateVoiceUi(); if (S.playing){ const t = nowSec(); seek(t); } };
$("autoSkip").checked = S.autoSkip;
$("autoSkip").onchange = e => { S.autoSkip = e.target.checked; store.set("lf.autoSkip", S.autoSkip); };
$("myVol").value = S.myVol; $("otherVol").value = S.otherVol;
$("myVol").oninput = e => { S.myVol = +e.target.value; store.set("lf.myVol", S.myVol); };
$("otherVol").oninput = e => { S.otherVol = +e.target.value; store.set("lf.otherVol", S.otherVol); };
function openSheet(id){ $(id).hidden = false; }
function closeSheets(){ $("libScrim").hidden = true; $("setScrim").hidden = true; $("lyrScrim").hidden = true; showErr(""); }

/* ---- lyrics export: one line per phrase (a new line after every rest) ---- */
function lyricLines(){
  const song = S.song, p = song.parts[S.part];
  return p.verses.map(v => {
    const tr = v === S.verse ? S.track : buildTrack(song, S.part, v);
    const lines = []; let cur = null, prevE = null;
    for (const w of tr.words){
      if (!cur || w.s - prevE > 1e-3){ cur = { bar: song.numbers[song.order[measureAt(w.s)]], words: [] }; lines.push(cur); }
      cur.words.push(w.full); prevE = w.e;
    }
    return { verse: v, lines };
  });
}
function lyricsText(){
  const nums = $("lyrNums").checked, p = S.song.parts[S.part], verses = lyricLines();
  const out = [S.songName, p.name];
  for (const vs of verses){
    out.push("");
    if (verses.length > 1) out.push(`【${vs.verse}番】`);
    for (const l of vs.lines) out.push((nums ? l.bar + "\t" : "") + l.words.join(" "));
  }
  return out.join("\n");
}
function paintLyrics(){
  $("lyrTitle").textContent = `歌詞を書き出す（${S.song.parts[S.part].name}）`;
  $("lyrText").value = lyricsText();
}
$("lyrOpen").onclick = () => { $("setScrim").hidden = true; paintLyrics(); openSheet("lyrScrim"); };
$("lyrNums").onchange = paintLyrics;
const lyrMsg = t => { $("lyrMsg").textContent = t; };
$("lyrCopy").onclick = () => {
  const t = $("lyrText").value;
  const fallback = () => { const ta = $("lyrText"); ta.focus(); ta.select(); lyrMsg("選択しました。長押しでコピーしてください。"); };
  try { navigator.clipboard.writeText(t).then(() => lyrMsg("コピーしました。"), fallback); } catch(e){ fallback(); }
};
// Inside the Claude viewer, files go through its save prompt and printing is unavailable;
// on an ordinary web host (e.g. GitHub Pages) the browser's own download and print are used.
const inClaudeViewer = !!(window.claude && window.claude.use);
if (inClaudeViewer) $("guideLink").hidden = true;   // the guide page lives next to the app on the web host only
let downloads = null;
if (inClaudeViewer){
  $("lyrPdf").hidden = true;
  $("lyrMsg").textContent = "";
  window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
}
$("lyrTxt").onclick = async () => {
  const fname = `${S.songName}_${S.song.parts[S.part].name}_歌詞.txt`.replace(/[\\/:*?"<>|]/g, "_");
  if (inClaudeViewer){
    if (!downloads){ lyrMsg("この画面では保存できません。「コピー」をお使いください。"); return; }
    try { await downloads.save({ filename: fname, data: $("lyrText").value }); lyrMsg("保存しました。"); }
    catch(e){ lyrMsg(e && e.code === "declined" ? "" : "保存できませんでした。「コピー」をお使いください。"); }
    return;
  }
  const blob = new Blob(["﻿" + $("lyrText").value.replace(/\n/g, "\r\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
$("lyrPdf").onclick = () => {
  const nums = $("lyrNums").checked, verses = lyricLines(), pa = $("printArea");
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let h = `<h1>${esc(S.songName)}</h1><p class="who">${esc(S.song.parts[S.part].name)}</p>`;
  for (const vs of verses){
    if (verses.length > 1) h += `<h2>${esc(vs.verse)}番</h2>`;
    for (const l of vs.lines) h += `<p>${nums ? `<span class="n">${esc(l.bar)}</span>` : ""}${esc(l.words.join(" "))}</p>`;
  }
  pa.innerHTML = h;
  const t = document.title; document.title = `${S.songName}_${S.song.parts[S.part].name}_歌詞`;
  try { window.print(); } catch(e){}
  setTimeout(() => { document.title = t; }, 1000);
};
$("songBtn").onclick = () => openSheet("libScrim");
$("demoBtn").onclick = async () => { await loadDemo(); closeSheets(); };
$("setBtn").onclick = () => openSheet("setScrim");
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheets);
document.querySelectorAll(".scrim").forEach(s => s.addEventListener("click", e => { if (e.target === s) closeSheets(); }));
document.addEventListener("keydown", e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.code === "Space"){ e.preventDefault(); S.playing ? pause() : play(); }
  else if (e.key === "ArrowLeft") seek(nowSec() - 10 * S.speed);
  else if (e.key === "ArrowRight") seek(nowSec() + 10 * S.speed);
  else if (e.key === "Escape"){ closeMenu(); closeSheets(); }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.playing){ try { navigator.wakeLock?.request("screen").then(l => S.lock = l).catch(() => {}); } catch(e){} } });

paintSpeed();
(async () => {
  await DB.open();
  let ok = false;
  if (store.get("lf.last", "demo") !== "demo"){ try { ok = await loadLast(); } catch(e){ ok = false; } }
  if (!ok) await loadDemo();
})();
})();
